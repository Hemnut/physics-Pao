<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุป บทที่ 12 แสงเชิงฟิสิกส์ | ฟิสิกส์ จารย์เปา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold mb-6">สรุปเนื้อหา บทที่ 12: แสงเชิงฟิสิกส์</h1>
    <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
        <h2 class="text-xl font-bold text-indigo-700">1. การแทรกสอด (สลิตคู่)</h2>
        <p class="text-sm">แถบสว่าง: $d \sin\theta = n\lambda$ | แถบมืด: $d \sin\theta = (n - \frac{1}{2})\lambda$</p>
        <h2 class="text-xl font-bold text-indigo-700">2. เกรตติง (Grating)</h2>
        <p class="text-sm">ระยะช่อง $d = \frac{1}{N}\text{ cm}$ โดย $d \sin\theta = n\lambda$</p>
    </div>
</main>
</body>
</html>
