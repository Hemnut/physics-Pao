<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka Lab - สื่อการสอนถ้วยยูรีกา | ฟิสิกส์ จารย์เปา</title>
    <!-- โหลดฟอนต์ Prompt และ Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'Inter', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-600 to-sky-400 text-white w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <span class="font-bold text-lg text-slate-900 flex flex-col">
                    ฟิสิกส์ จารย์เปา
                    <span class="text-[0.65rem] tracking-[2px] font-inter text-blue-600 -mt-1">EUREKA VIRTUAL LAB</span>
                </span>
            </div>
            
            <nav class="flex items-center gap-4">
                <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition">
                    <i class="fa-solid fa-house"></i> กลับหน้าหลัก
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Container สำหรับฝัง Google Sites -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full flex flex-col">
        
        <div class="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Eureka Lab: สื่อการสอนเรื่องถ้วยยูรีกา</h1>
                <p class="text-xs sm:text-sm text-slate-500">ทดลองหาปริมาตรและความหนาแน่นของวัตถุเสมือนจริง</p>
            </div>
            <a href="https://sites.google.com/view/physicsjarnpao/%E0%B8%96%E0%B8%A7%E0%B8%A2%E0%B8%A2%E0%B9%80%E0%B8%A3%E0%B8%81%E0%B8%B2" target="_blank" class="text-xs font-semibold text-blue-600 hover:text-blue-800 inline-flex items-center gap-1">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดในหน้าต่างใหม่
            </a>
        </div>

        <!-- กรอบ iframe แสดงผล Google Sites -->
        <div class="w-full flex-grow bg-white rounded-2xl border border-slate-200 shadow-md overflow-hidden min-h-[750px] relative">
            <iframe 
                src="https://sites.google.com/view/physicsjarnpao/%E0%B8%96%E0%B8%A7%E0%B8%A2%E0%B8%A2%E0%B9%80%E0%B8%A3%E0%B8%81%E0%B8%B2" 
                class="w-full h-full min-h-[750px] border-0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-6">
        <p>&copy; 2026 PhysicsHub - ฟิสิกส์ จารย์เปา. All rights reserved.</p>
    </footer>

</body>
</html>
