<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุป บทที่ 14 ไฟฟ้ากระแส | ฟิสิกส์ จารย์เปา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold mb-6">สรุปเนื้อหา บทที่ 14: ไฟฟ้ากระแส</h1>
    <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
        <h2 class="text-xl font-bold text-rose-700">1. กฎของโอห์มและสภาพต้านทาน</h2>
        <p class="text-sm">$V = IR$ | $R = \rho \frac{L}{A}$</p>
        <h2 class="text-xl font-bold text-rose-700">2. วงจรไฟฟ้าและแรงเคลื่อนไฟฟ้า</h2>
        <p class="text-sm">$E = I(R + r)$ (เมื่อ $r$ คือความต้านทานภายใน)</p>
    </div>
</main>
</body>
</html>
