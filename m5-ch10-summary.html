<!DOCTYPE html>

    <title>สรุป บทที่ 10 เสียง | ฟิสิกส์ จารย์เปา</title>

</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold mb-6">สรุปเนื้อหา บทที่ 10: เสียง</h1>
    <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
        <h2 class="text-xl font-bold text-sky-700">1. อัตราเร็วเสียงในอากาศ</h2>
        <p class="text-sm">$v = 331 + 0.6t$ (เมื่อ $t$ คืออุณหภูมิในหน่วย Celsius)</p>
        <h2 class="text-xl font-bold text-sky-700">2. ระดับเสียงและการบีต</h2>
        <p class="text-sm">ระดับเสียง $\beta = 10 \log\left(\frac{I}{I_0}\right)$ (dB) | ความถี่บีต $f_{beat} = |f_1 - f_2|$</p>
    </div>
</main>
