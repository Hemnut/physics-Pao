    <title>สรุป บทที่ 11 แสงและทัศนอุปกรณ์ | ฟิสิกส์ จารย์เปา</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold mb-6">สรุปเนื้อหา บทที่ 11: แสงและทัศนอุปกรณ์</h1>
    <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
        <h2 class="text-xl font-bold text-amber-700">1. การสะท้อนและการหักเห</h2>
        <p class="text-sm">สูตรกระจก/เลนส์: $\frac{1}{f} = \frac{1}{s} + \frac{1}{s'}$[cite: 2]</p>
        <p class="text-sm">กำลังขยาย: $m = \frac{s'}{s} = \frac{f}{s - f}$[cite: 2]</p>
        <h2 class="text-xl font-bold text-amber-700">2. ความลึกจริง-ความลึกปรากฏ</h2>
        <p class="text-sm">$\frac{\text{ลึกปรากฏ}}{\text{ลึกจริง}} = \frac{n_2}{n_1}$[cite: 2]</p>
    </div>
</main>
